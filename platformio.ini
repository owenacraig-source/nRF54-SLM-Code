[platformio]
default_envs = xiao_nrf54lm20a

[env:xiao_nrf54lm20a]
; Seeed's platform supplies this board and Zephyr 4.4. Stock nordicnrf52 does not.
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#a6fd41debbbcda13b5340fff50c9092ed3289194
board = seeed-xiao-nrf54lm20a
framework = zephyr
extra_scripts = pre:tools/pio_build_dir.py
monitor_speed = 115200
; Board USB connector -> SAMD11 USB CDC/UART bridge -> nRF UART20.
upload_protocol = cmsis-dap

