CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CRC=y
CONFIG_GPIO=y
CONFIG_PINCTRL=y

# Enable the board PMIC infrastructure, including its VBUS current-limit init.
CONFIG_I2C=y
CONFIG_MFD=y
CONFIG_REGULATOR=y
CONFIG_SENSOR=y

# UART20 belongs exclusively to the binary audio protocol.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_SHELL=n
CONFIG_BT=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_DEVICE_STACK_NEXT=n

CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_ASSERT=y
CONFIG_STACK_SENTINEL=y
CONFIG_APP_RECORD_DELAY_MS=10000
CONFIG_APP_CAPTURE_DURATION_MS=4000
CONFIG_APP_GAIN_DB=20

